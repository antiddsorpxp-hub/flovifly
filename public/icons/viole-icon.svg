<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B0E2E"/>
      <stop offset="100%" stop-color="#0B0512"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="122" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="190" fill="url(#glow)"/>

  <!-- soundwave bars fading into the V -->
  <g stroke="url(#v)" stroke-linecap="round" stroke-width="20">
    <line x1="120" y1="256" x2="120" y2="230"/>
    <line x1="152" y1="256" x2="152" y2="200"/>
    <line x1="184" y1="256" x2="184" y2="168"/>
  </g>
  <g stroke="url(#v)" stroke-linecap="round" stroke-width="20">
    <line x1="392" y1="256" x2="392" y2="230"/>
    <line x1="360" y1="256" x2="360" y2="200"/>
    <line x1="328" y1="256" x2="328" y2="168"/>
  </g>

  <!-- the V mark -->
  <path d="M186 176 L256 344 L326 176" fill="none" stroke="url(#v)"
        stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="344" r="20" fill="#DDD6FE"/>
</svg>
