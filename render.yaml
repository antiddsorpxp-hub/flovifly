services:
  - type: web
    name: viole-messenger
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: viole-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
