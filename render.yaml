services:
  - type: web
    name: flovifly
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: profile-media
      - key: OWNER_USERNAME
        value: flovifly
      - key: OWNER_PASSWORD
        sync: false
