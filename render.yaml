services:
  - type: web
    name: viole-messenger
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: viole-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
# PostgreSQL можно подключить следующим этапом, когда понадобится несколько серверов.
